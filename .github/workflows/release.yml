name: Release

# A pushed tag builds the installer and publishes it. The tag must match
# <Version> in TokenHub/TokenHub.csproj, otherwise the app's own updater would
# compare against a version that no build ever reported.
on:
  push:
    tags:
      - 'v*'
  # Manual runs build and test only; no release is created.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast gate: the shipped binary starts, reports its version and the MCP server
  # answers. Runs before the slower installer build so a broken payload fails early.
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish single-file build
        run: dotnet publish TokenHub\TokenHub.csproj -c Release -p:PublishProfile=SingleFile -o smoke

      - name: The binary reports the project version
        shell: pwsh
        run: |
          $expected = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content TokenHub\TokenHub.csproj -Raw)).Groups[1].Value
          $reported = (& smoke\TokenHub.exe --version | Out-String).Trim()
          Write-Host "reported=$reported expected=$expected"
          if ($reported -ne $expected) { throw "Version mismatch: $reported vs $expected" }

      - name: The MCP server lists its tools
        shell: pwsh
        run: |
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path 'smoke\TokenHub.exe').Path
          $psi.Arguments = '--mcp-memory'
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $process = [System.Diagnostics.Process]::Start($psi)
          $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          $process.StandardInput.Close()
          $answer = $process.StandardOutput.ReadToEnd()
          $process.WaitForExit(15000) | Out-Null
          if ($answer -notmatch 'skill_search') { throw "skill_search is missing from tools/list" }
          if ($answer -notmatch 'memory_search') { throw "memory_search is missing from tools/list" }

  build:
    needs: smoke
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Tests
        run: dotnet run --project TokenHub.Tests\TokenHub.Tests.csproj -c Release

      - name: Check tag against the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $project = Get-Content TokenHub\TokenHub.csproj -Raw
          if ($project -notmatch [regex]::Escape("<Version>$tag</Version>")) {
            throw "Tag $tag does not match <Version> in TokenHub\TokenHub.csproj"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          if ($version) {
            powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1 -Version $version
          } else {
            powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1
          }

      - name: Upload the build for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TokenHub-Setup
          path: installer/dist/TokenHub-Setup-*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/TokenHub-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true